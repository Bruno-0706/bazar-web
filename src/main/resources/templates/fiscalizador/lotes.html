<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotes do Fiscalizador - Bazar</title>
</head>
<body>
    <h1>Área do Fiscalizador</h1>

    <p>
        Bem-vindo,
        <strong th:text="${usuario.nome}">Nome do fiscalizador</strong>!
    </p>

    <h2>Meus lotes</h2>
    
    <p>
    	<a th:href="@{/fiscalizador/lotes/novo}">
        	Cadastrar novo lote
    	</a>
	</p>

    <p th:if="${erro}" th:text="${erro}" style="color: red;"></p>

    <p th:if="${#lists.isEmpty(lotes)}">
        Você ainda não cadastrou nenhum lote.
    </p>

    <table th:unless="${#lists.isEmpty(lotes)}"
           border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Data de entrega</th>
                <th>Observação</th>
                <th>Status</th>
                <th>ID do donatário</th>
                <th>Ações</th>
            </tr>
        </thead>


        <tbody>
            <tr th:each="lote : ${lotes}">
                <td th:text="${lote.id}"></td>

                <td th:text="${lote.dataEntrega != null
                    ? #temporals.format(lote.dataEntrega, 'dd/MM/yyyy')
                    : 'Não definida'}"></td>

                <td th:text="${lote.observacao != null
                    ? lote.observacao
                    : '-'}"></td>

                <td th:text="${lote.status}"></td>

                <td th:text="${lote.donatarioId != null
                    ? lote.donatarioId
                    : 'Não doado'}"></td>

				<td><a th:if="${lote.status == 'DISPONIVEL'}"
					th:href="@{/fiscalizador/lotes/{id}/produtos/novo(id=${lote.id})}">
						Cadastrar produtos </a> <span
					th:unless="${lote.status == 'DISPONIVEL'}"> Lote doado </span> <a
					th:href="@{/fiscalizador/lotes/{id}/produtos(id=${lote.id})}">
						Visualizar produtos </a>
						
						<a th:if="${lote.status == 'DISPONIVEL'}"
							th:href="@{/fiscalizador/lotes/{id}/doar(id=${lote.id})}">
							Doar lote	
						</a>
						
						</td>

			</tr>
        </tbody>
    </table>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Sair</button>
    </form>
</body>
</html>
